apiVersion: v2
name: teleflow
description: TeleFlow Platform — Business & Software as Code (instancia por organismo, ADR-005)
type: application
version: 1.0.0
appVersion: "1.0.0"

# Sin dependencias a propósito. Postgres, Redis y RabbitMQ eran subcharts de Bitnami y ahora son
# StatefulSets propios (`templates/datos.yaml`), con **las mismas imágenes oficiales que usa el
# docker-compose.yml**. Motivo en el ADR de la wiki "de dónde salen Postgres, Redis y RabbitMQ en
# el chart de Helm" (2026-07-30): las imágenes que pedían los subcharts fueron retiradas de Docker
# Hub, y al investigarlo apareció que dev/CI y producción no compartían la capa de datos.
#
# Consecuencia práctica: ya no hace falta `helm dependency update` antes de instalar.
