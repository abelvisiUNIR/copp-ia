name: Imágenes referenciadas

# Vigila que las imágenes de contenedor que el repo referencia todavía existan en su registry.
#
# Va **programado y no por push** porque el modo de falla no tiene commit asociado: las imágenes
# de los subcharts de Bitnami desaparecieron de Docker Hub y rompieron el chart sin que nadie
# tocara un archivo. Un disparador por `push` no se habría enterado nunca — no hubo push.
#
# Y va en un workflow aparte de `ci.yml` porque **no es un gate de merge**: depende de una red y
# de un tercero, y un gate que puede fallar por el registry es peor que uno lento que no falla
# (ya pasó: una corrida de `quality` en rojo con exit 125 por un timeout contra
# registry-1.docker.io, con mypy y los tests en verde). La mitad determinista —que las
# referencias estén bien formadas y que compose y chart coincidan— sí gatea, desde
# `tests/test_imagenes_contract.py`, sin tocar la red.
#
# Ojo: GitHub deshabilita los workflows programados tras 60 días sin actividad en el repo.

on:
  schedule:
    # Lunes 06:00 UTC. Semanal alcanza: esto detecta un cambio del ecosistema, no una regresión
    # propia, y consultar de más gasta cuota del rate limit sin dar más señal.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  existencia:
    name: ¿Siguen existiendo?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # El script es stdlib pura: no hace falta instalar el proyecto, solo un intérprete. Se fija
      # la versión igual que en `ci.yml` en vez de confiar en el `python` que traiga el runner.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Sin credenciales, el rate limit anónimo de Docker Hub corta la consulta y el resultado
      # queda inconcluso (exit 2). No es un secreto obligatorio: si no está, el job igual corre
      # y **dice** que no pudo verificar, en vez de afirmar que las imágenes faltan.
      - name: Login en Docker Hub (si hay credenciales)
        if: vars.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Los tres desenlaces se distinguen a propósito. El rojo por "no existe" es un hallazgo
      # real; el rojo por "no se pudo verificar" también corta, porque un vigía que se queda
      # callado cuando no puede mirar es indistinguible de uno que no encuentra nada — y esa es
      # justamente la falla que este workflow existe para detectar, una capa más arriba.
      - name: Verificar que las imágenes existen
        run: |
          set +e
          python scripts/verificar_imagenes.py
          codigo=$?
          set -e
          case $codigo in
            0) echo "::notice::Todas las imágenes referenciadas existen." ;;
            1) echo "::error::Hay imágenes referenciadas que ya no existen en su registry." ;;
            2) echo "::error::No se pudo verificar (registry inalcanzable o rate limit). Esto NO dice que falten." ;;
            *) echo "::error::El verificador falló de forma inesperada (exit $codigo)." ;;
          esac
          exit $codigo
