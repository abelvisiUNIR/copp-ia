name: CI

on:
  push:
    branches: [desarrollo, devyos]
  pull_request:
    branches: [desarrollo]

# Cancela corridas viejas del mismo ref si llega una nueva
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests + mypy (strict, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # target del proyecto (pyproject requires-python >=3.11)
          cache: pip

      - name: Install (con extras dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check (mypy --strict)
        run: mypy teleflow

      - name: Tests
        run: pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen de servicios Python
        run: docker build -t teleflow:ci .
