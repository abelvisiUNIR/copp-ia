global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Sin `alerting:` a propósito: no hay Alertmanager en el compose. Las alertas se evalúan igual y
# se ven en la pestaña Alerts de Prometheus, que alcanza para dev y para verificarlas en CI. El
# ruteo (a quién se le avisa) es del organismo, no del producto — mismo criterio que el resto de
# la observabilidad del chart.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: teleflow
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000
          - parser-service:8001
          - executor-service:8002
          - registry-service:8003
          - composer-service:8004
          # Publica los gauges de negocio (backlog de human_tasks, instancias vivas). Si falta
          # acá, los paneles de negocio quedan sin datos y nada lo avisa: el dashboard muestra
          # "No data", que se lee igual que "no hay trabajo pendiente".
          - metrics-service:8005
        labels:
          platform: teleflow
