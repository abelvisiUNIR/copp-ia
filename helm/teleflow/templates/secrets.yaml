{{/*
  Credenciales de la instancia.

  Tres modos, en este orden:
    1. `existingSecret: <nombre>` — el organismo crea y rota el Secret por fuera del chart
       (lo esperable con un gestor externo tipo Vault). El chart solo lo consume.
    2. `apiKey: <valor>` — el chart crea el Secret. Práctico para dev y para una instalación
       chica que no tiene gestor de secretos.
    3. Ninguno de los dos — el install FALLA acá, en el `helm install`, con el mensaje de abajo.

  Por qué falla en vez de traer un default: un `dev-key-change-me` que funciona es peor que un
  error, porque la instalación queda arriba y nadie se entera de que la key es pública. Mismo
  criterio que el composer, que no arranca sin proveedor real configurado en vez de caer al
  stub en silencio.
*/}}
{{/*
  Y si el Secret se declara pero no existe, también corta acá.

  La guarda de abajo cubría "no declaraste ninguno de los dos". No cubría el error más probable
  de un primer install —declarar `existingSecret` y olvidarse de crearlo— y ese caso terminaba
  peor: `helm install` decía **"Install complete"** y los 18 pods quedaban en
  `CreateContainerConfigError`, con el motivo real (`secret "..." not found`) enterrado en los
  eventos del pod. Medido instalando sin crearlo.

  `lookup` devuelve vacío cuando no hay cluster (`helm template`, `--dry-run` del lado cliente),
  y **también** cuando el objeto no está: los dos casos se ven igual. Por eso primero se sondea
  `kube-system`, que existe en cualquier cluster vivo y vuelve vacío en un render offline. Sin
  esa sonda, `helm template --set existingSecret=...` fallaría diciendo que falta un Secret que
  nadie podía haber creado — y el job `chart` de CI renderiza sin cluster.
*/}}
{{- if and .Values.existingSecret .Release.IsInstall (lookup "v1" "Namespace" "" "kube-system") }}
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.existingSecret) }}
{{- fail (printf "\n\nEl Secret '%s' no existe en el namespace '%s'.\nCrealo antes de instalar:\n  kubectl -n %s create secret generic %s --from-literal=TELEFLOW_API_KEY='<valor>'\n\nSin esto el install termina 'complete' y los pods quedan en CreateContainerConfigError.\n" .Values.existingSecret .Release.Namespace .Release.Namespace .Values.existingSecret) }}
{{- end }}
{{- end }}
{{- if not .Values.existingSecret }}
{{- if not .Values.apiKey }}
{{- fail "\n\nFalta la API key del gateway. Elegí una de las dos:\n  --set apiKey=<valor>                (el chart crea el Secret)\n  --set existingSecret=<nombre>       (ya creaste el Secret, con las claves TELEFLOW_API_KEY y opcionalmente LLM_API_KEY)\n" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teleflow.secretName" . }}
  labels:
    {{- include "teleflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  TELEFLOW_API_KEY: {{ .Values.apiKey | quote }}
  {{- with .Values.llmApiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{/*
  Credenciales de la capa de datos **propia** del chart.

  Van en su propio Secret y no en el de las API keys a propósito: aquel puede venir del
  organismo (`existingSecret`) y su contrato son las claves de aplicación. Mezclarlos obligaría
  a que quien administra las API keys por fuera tuviera además que conocer las de la base.

  Por qué existe: antes la contraseña se interpolaba en el env de **cada** pod
  (`DATABASE_URL`, `RABBITMQ_URL`, `POSTGRES_PASSWORD`, …), así que aparecía 28 veces en los
  manifiestos renderizados y la veía cualquiera con permiso de `get pod`. Ahora vive en un
  objeto, y los pods la referencian.

  Lo que esto **no** arregla: el valor sigue viniendo de `values.yaml` en texto plano al momento
  de instalar. Para que no exista en ningún archivo hay que usar la capa de datos del organismo
  con `external<Comp>.existingSecret` (ver README), que es el camino recomendado en producción.

  Con el componente en `enabled: false` no se genera su clave: esas credenciales son del
  organismo y viven en su Secret.
*/}}
{{- if or .Values.postgres.enabled .Values.rabbitmq.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teleflow.datosSecretName" . }}
  labels:
    {{- include "teleflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  DATABASE_URL: {{ include "teleflow.databaseUrl" . | quote }}
  {{- end }}
  {{- if .Values.rabbitmq.enabled }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.auth.password | quote }}
  RABBITMQ_URL: {{ include "teleflow.rabbitmqUrl" . | quote }}
  {{- end }}
{{- end }}
