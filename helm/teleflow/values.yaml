image:
  repository: registry.example.com/teleflow/teleflow
  tag: "1.0.0"
  pullPolicy: IfNotPresent

uiImage:
  repository: registry.example.com/teleflow/review-ui
  tag: "1.0.0"

# Credenciales. Hay que definir UNA de las dos: `apiKey` (el chart crea el Secret) o
# `existingSecret` (el organismo lo administra por fuera, con las claves TELEFLOW_API_KEY y
# opcionalmente LLM_API_KEY). Si faltan las dos, el `helm install` falla diciendo el motivo —
# a propósito: una key por default que funciona deja la instalación arriba y a nadie enterado.
apiKey: ""
llmApiKey: ""
existingSecret: ""

# Dominio del cluster. Solo lo necesita el nginx del review-ui, que resuelve el gateway por
# FQDN (su `resolver` no aplica la lista `search` de /etc/resolv.conf).
clusterDomain: cluster.local

# Ni los URLs de Postgres/Redis/RabbitMQ ni los de los servicios entre sí se declaran acá: los
# deriva `_helpers.tpl` del nombre del release, igual que los nombra cada subchart. Cuando
# estaban hardcodeados (`teleflow-postgresql`, `http://parser-service:8001`) el chart solo
# funcionaba si el release se llamaba `teleflow`, y sin decirlo en ninguna parte.
env:
  LLM_PROVIDER: stub
  WORKER_CONCURRENCY: "10"

# Solo se usan con el subchart correspondiente en `enabled: false`.
externalDatabase:
  host: ""
externalRedis:
  host: ""
externalRabbitmq:
  host: ""

# Réplicas según la sección 10.2 del documento de arquitectura
# (docs/teleflow-deployment.typ).
services:
  api-gateway:
    port: 8000
    replicas: 2
    module: teleflow.gateway.main:app
    external: true
  parser-service:
    port: 8001
    replicas: 2
    module: teleflow.parser_service.main:app
  registry-service:
    port: 8003
    replicas: 2
    module: teleflow.registry_service.main:app
  executor-service:
    port: 8002
    replicas: 3
    module: teleflow.executor_service.main:app
  composer-service:
    port: 8004
    replicas: 1
    module: teleflow.composer_service.main:app

# Cómo se entra al gateway desde fuera del cluster. La doc (§10.2) dice "detrás de
# Ingress/LoadBalancer" y el chart no tenía ninguno de los dos: era `type: LoadBalancer` fijo,
# que en kind queda `<pending>` para siempre. En local: `kubectl port-forward`.
gateway:
  service:
    type: ClusterIP
  ingress:
    enabled: false
    className: ""
    host: teleflow.local
    annotations: {}
    tls: []

reviewUi:
  enabled: true
  port: 3100
  replicas: 2

migrations:
  enabled: true  # Job `alembic upgrade head` (Job normal, NO hook — ver migrate-job.yaml)
  # Segundos que un initContainer espera a que Postgres acepte conexiones antes de rendirse.
  waitForDbSeconds: 120
  # Segundos que cada servicio espera a que el schema llegue a `head` antes de rendirse.
  waitForSchemaSeconds: 300

# Capa de datos. Las imágenes son **las mismas del docker-compose.yml** a propósito: antes esto
# eran tres subcharts de Bitnami y el compose usaba las oficiales, así que los e2e probaban una
# capa de datos distinta de la de producción. Si cambia una, cambia la otra.
#
# Poner `enabled: false` y llenar el `external*.host` de arriba para usar una base que el
# organismo ya administra.
postgres:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: teleflow
    password: teleflow      # ← pendiente Fase E: sacarlo de values a un Secret
    database: teleflow
  persistence:
    size: 8Gi
    storageClass: ""        # vacío = la StorageClass default del cluster
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  # Sin `persistence`: es cache y pub/sub, el durable sleep vive en Postgres (ADR-002).
  # Igual que en el compose, que tampoco le da volumen.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

rabbitmq:
  enabled: true
  image: rabbitmq:3.13-management-alpine
  auth:
    username: teleflow
    password: teleflow      # ← pendiente Fase E: sacarlo de values a un Secret
  persistence:
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
