[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleflow"
version = "1.0.0"
description = "TeleFlow Platform - Business & Software as Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "lark>=1.1.9",
    "networkx>=3.2",
    "httpx>=0.27",
    "aio-pika>=9.4",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    # Solo para tests: permite ejercitar SQL real (rowcount de un UPDATE con WHERE) sin
    # depender de que Postgres sea alcanzable desde el host, que a propósito no lo es.
    "aiosqlite>=0.20",
]

[project.scripts]
tflow = "teleflow.cli:main"

[tool.setuptools.packages.find]
include = ["teleflow*"]

[tool.setuptools.package-data]
"teleflow.dsl" = ["*.lark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: tests end-to-end contra el stack levantado (requieren docker compose up)",
]

[tool.mypy]
strict = true
python_version = "3.11"

# Sin esto, `mypy .` aborta con "Duplicate module named conftest" (tests/ y tests/e2e/ tienen
# uno cada uno) y —lo importante— **no chequea nada**: sale con un solo error y un
# "errors prevented further checking" que se lee como si hubiera pasado. Los paths se
# resuelven desde la raíz del repo, así que los dos conftest son módulos distintos.
explicit_package_bases = true
mypy_path = "."

# networkx no publica tipos compatibles con py3.11 (sus stubs arrastran numpy
# con sintaxis 3.12). Se trata como sin-tipos; el uso local es acotado.
[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

# Los tests se chequean, pero no se les exige anotar cada función: anotar ~350 firmas de test
# es ruido mecánico y no encuentra nada. Lo que sí queda cubierto —y es el motivo de
# incluirlos— es que un cambio de firma en `teleflow/` rompa el type check de sus tests.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# Script suelto de la raíz (genera diagramas para docs/, viene del commit inicial): no es
# código del producto y no se importa desde `teleflow/`. Mismo trato que los tests — se
# chequea, pero no se le exigen anotaciones.
[[tool.mypy.overrides]]
module = "gen_excalidraw"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
