# Reglas de alerta de TeleFlow. **Única fuente**, con dos consumidores:
#
#   - el Prometheus del compose (dev y CI), que las hornea en su imagen — ver
#     `observability/prometheus.Dockerfile`;
#   - el Prometheus del organismo, vía el `PrometheusRule` **opt-in** que arma
#     `templates/observabilidad.yaml` leyendo este mismo archivo.
#
# Viven dentro del chart —y no en `observability/`, que es donde uno las buscaría— porque Helm
# solo puede leer archivos de adentro del chart. Es el mismo arreglo que los dashboards, por el
# mismo motivo: dos copias de un archivo de alertas se desincronizan sin que nada avise.
#
# Los tests unitarios de estas reglas están en `observability/alerts_test.yml`
# (`promtool test rules`), fuera del chart para no empaquetar un archivo de test en el release.
#
# Criterio: se alerta sobre lo que **no se nota**. Un gateway caído lo reporta el primer usuario
# que entra; un backlog de human_tasks que dejó de actualizarse no lo reporta nadie, porque
# sigue mostrando un número plausible.
groups:
  - name: teleflow-disponibilidad
    rules:
      - alert: TeleFlowServicioCaido
        # `platform: teleflow` lo ponen los static_configs de prometheus.yml. Sin el filtro,
        # esta regla también alertaría por targets de otros proyectos si el Prometheus se
        # comparte.
        expr: up{platform="teleflow"} == 0
        # 2m tolera un reinicio o un redeploy sin despertar a nadie: el scrape es cada 15s, así
        # que hacen falta ~8 fallidos seguidos.
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} no responde al scrape"
          description: >-
            Prometheus no puede scrapear {{ $labels.instance }} desde hace 2 minutos.
            Si es metrics-service, además de perder sus métricas los paneles de negocio quedan
            sin datos: corre en una sola réplica a propósito y no tiene quien lo reemplace.

  - name: teleflow-metricas-de-negocio
    rules:
      - alert: TeleFlowMetricasDeNegocioCongeladas
        # El caso que `up` NO detecta, y el motivo por el que este grupo existe. El colector
        # atrapa cualquier excepción del refresh, la loguea y sigue (a propósito: un fallo de
        # métricas no debe bajar el servicio). Con la DB caída el pod queda vivo, /metrics sigue
        # respondiendo y los gauges devuelven **el último valor bueno** — un backlog congelado en
        # 10 es indistinguible de un backlog estable de 10, y `up` vale 1.
        #
        # El umbral son 6 ciclos de BUSINESS_METRICS_INTERVAL (30 s por default). Si se sube ese
        # intervalo en una instalación, hay que subir esto con él o la alerta se vuelve ruido.
        expr: time() - teleflow_business_metrics_last_success_timestamp_seconds > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Los gauges de negocio están congelados hace {{ $value | humanizeDuration }}"
          description: >-
            metrics-service responde pero no logra refrescar los gauges de negocio. Lo que
            muestran los paneles es el último valor bueno, no el estado actual — tratarlo como
            desactualizado, no como real. Causa típica: Postgres inalcanzable desde el pod.
            Confirmar con el contador teleflow_business_metrics_refresh_failures_total (sube si
            el refresh está fallando; queda quieto si el colector nunca arrancó) y con los logs
            `business_metrics_error` del servicio.

      - alert: TeleFlowSinPublicadorDeMetricasDeNegocio
        # Ni `up == 0` ni la frescura detectan que el target **no exista**: sin serie no hay
        # nada que evaluar, y las dos reglas de arriba callan. Es el modo de falla que ya está
        # anotado en prometheus.yml y que ocurrió de verdad al mover el colector del executor a
        # su propio servicio — el servicio nuevo quedó fuera de la lista de targets.
        expr: absent(teleflow_business_metrics_last_success_timestamp_seconds)
        # 5m: al arrancar el stack de cero, la serie tarda en aparecer y no es una falla.
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nadie está publicando las métricas de negocio"
          description: >-
            No existe la serie teleflow_business_metrics_last_success_timestamp_seconds. O
            metrics-service no está desplegado, o no está en los targets de Prometheus. Los
            paneles de negocio muestran "No data", que se lee igual que "no hay trabajo
            pendiente" — la lectura tranquilizadora equivocada.
