{{- range $name, $svc := .Values.services }}
{{- $fullName := printf "%s-%s" $.Release.Name $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ $fullName }}
    {{- include "teleflow.labels" $ | nindent 4 }}
spec:
  {{- if and $.Values.autoscaling.enabled (eq $name "executor-service") }}
  # Sin `replicas` a propósito: lo gobierna el HorizontalPodAutoscaler. Declararlo igual haría
  # que cada `helm upgrade` devolviera la escala al número de `values.yaml` y el HPA la volviera
  # a subir — un pod que aparece y desaparece en cada deploy, sin que nada falle ni se loguee.
  {{- else }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $fullName }}
  template:
    metadata:
      labels:
        app: {{ $fullName }}
        {{- include "teleflow.labels" $ | nindent 8 }}
      {{- if $.Values.observabilidad.scrapeAnnotations }}
      annotations:
        # Descubrimiento por anotaciones: lo lee la configuración clásica de `kubernetes_sd`.
        # Son inertes si el organismo no las mira, y sin ellas los servicios no aparecen en
        # ningún Prometheus salvo que alguien los agregue a mano.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      initContainers:
        {{- include "teleflow.waitForSchema" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["uvicorn", "{{ $svc.module }}", "--host", "0.0.0.0", "--port", "{{ $svc.port }}"]
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- include "teleflow.env" $ | nindent 12 }}
            - name: SERVICE_NAME
              value: {{ $name }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ $fullName }}
    {{- include "teleflow.labels" $ | nindent 4 }}
spec:
  {{- if $svc.external }}
  type: {{ $.Values.gateway.service.type }}
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    app: {{ $fullName }}
  ports:
    # El nombre importa: el ServiceMonitor referencia el puerto por nombre, no por número.
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
