{{/*
  Credenciales de la instancia.

  Tres modos, en este orden:
    1. `existingSecret: <nombre>` — el organismo crea y rota el Secret por fuera del chart
       (lo esperable con un gestor externo tipo Vault). El chart solo lo consume.
    2. `apiKey: <valor>` — el chart crea el Secret. Práctico para dev y para una instalación
       chica que no tiene gestor de secretos.
    3. Ninguno de los dos — el install FALLA acá, en el `helm install`, con el mensaje de abajo.

  Por qué falla en vez de traer un default: un `dev-key-change-me` que funciona es peor que un
  error, porque la instalación queda arriba y nadie se entera de que la key es pública. Mismo
  criterio que el composer, que no arranca sin proveedor real configurado en vez de caer al
  stub en silencio.
*/}}
{{- if not .Values.existingSecret }}
{{- if not .Values.apiKey }}
{{- fail "\n\nFalta la API key del gateway. Elegí una de las dos:\n  --set apiKey=<valor>                (el chart crea el Secret)\n  --set existingSecret=<nombre>       (ya creaste el Secret, con las claves TELEFLOW_API_KEY y opcionalmente LLM_API_KEY)\n" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teleflow.secretName" . }}
  labels:
    {{- include "teleflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  TELEFLOW_API_KEY: {{ .Values.apiKey | quote }}
  {{- with .Values.llmApiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
