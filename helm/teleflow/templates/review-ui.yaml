{{- if .Values.reviewUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-ui
  labels:
    app: review-ui
    {{- include "teleflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reviewUi.replicas }}
  selector:
    matchLabels:
      app: review-ui
  template:
    metadata:
      labels:
        app: review-ui
        {{- include "teleflow.labels" . | nindent 8 }}
    spec:
      containers:
        - name: review-ui
          image: "{{ .Values.uiImage.repository }}:{{ .Values.uiImage.tag }}"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: review-ui
  labels:
    app: review-ui
    {{- include "teleflow.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app: review-ui
  ports:
    - port: {{ .Values.reviewUi.port }}
      targetPort: 80
{{- end }}
