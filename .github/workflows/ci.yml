name: CI

on:
  push:
    branches: [desarrollo, devyos]
  pull_request:
    branches: [desarrollo]

# Cancela corridas viejas del mismo ref si llega una nueva
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests + mypy (strict, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # target del proyecto (pyproject requires-python >=3.11)
          cache: pip

      - name: Install (con extras dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check (mypy --strict)
        # Todo el repo, no solo `teleflow`: los tests también se chequean (sin exigirles
        # anotaciones, ver [tool.mypy.overrides] en pyproject.toml). Correr solo `teleflow`
        # dejaba fuera 58-35 archivos y ocultaba errores reales en los tests.
        run: mypy .

      - name: Tests unitarios
        run: pytest -m "not e2e" -q

  e2e:
    name: Tests e2e (stack docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Levantar el stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      # Las reglas de alerta no las cubre pytest: `promtool test rules` las evalúa contra series
      # sintéticas y comprueba que **disparen** en el escenario correcto. Sin esto, una regla con
      # un nombre de métrica mal escrito pasa CI y no dispara nunca — indistinguible de un
      # sistema sano.
      #
      # Va en este job y no en `quality` aunque no necesite el stack levantado: corre promtool
      # desde la **imagen que el `up --build` de arriba acaba de construir**, así que no hay
      # ningún pull. En `quality` sí lo había, y una corrida se puso roja con exit 125 por un
      # timeout contra registry-1.docker.io teniendo mypy y los tests en verde. Un gate rápido
      # que falla por el registry es peor que uno lento que no falla — y este repo ya sabe que
      # Docker Hub no es una dependencia confiable (las imágenes de los subcharts de Bitnami
      # desaparecieron de ahí y rompieron un artefacto que nadie había tocado).
      #
      # Es la imagen **construida** y no su base `prom/prometheus:vX`: con BuildKit, `compose
      # build` deja la base en su caché de build y **no** en el image store, así que un
      # `docker run` sobre ella falla con "No such image" aunque el build haya pasado recién.
      # Costó una corrida en rojo descubrirlo. La imagen construida, en cambio, tiene que estar
      # sí o sí — el stack está corriendo con ella.
      #
      # Efecto lateral bueno: promtool sale del mismo artefacto que va a evaluar estas reglas
      # en el compose, así que la versión coincide por construcción y no hay que sincronizarla
      # con nada.
      - name: Alertas de Prometheus (promtool test rules)
        run: |
          docker compose run --rm --no-deps -v "$PWD:/repo" -w /repo/observability \
            --entrypoint promtool prometheus test rules alerts_test.yml

      - name: Esperar readiness del gateway
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 3
          done
          echo "gateway no respondió a tiempo" && docker compose logs && exit 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (con extras dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests e2e
        run: pytest -m e2e -q

      # La review-ui se prueba contra el mismo stack: nginx ya sirve el bundle en :3100.
      # Es el componente desde el que se despliega código, así que su camino crítico
      # (aprobar despliega ese borrador, rechazar no despliega) merece cubrirse.
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: review-ui/package-lock.json

      - name: Instalar review-ui + Chromium
        working-directory: review-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests de UI
        working-directory: review-ui
        run: npm test

      - name: Reporte de UI si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: review-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Logs del stack si algo falla
        if: failure()
        run: docker compose logs

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build imagen de servicios Python
        run: docker build -t teleflow:ci .

  chart:
    name: Chart (render en los modos que soporta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      # El chart soporta dos capas de datos —la propia y la del organismo— y hasta ahora solo se
      # renderizaba la propia. El camino externo se rompe de formas que no se ven leyendo el
      # diff: un puerto que quedó fijo, credenciales que salen del bloque del componente que no
      # se instala, un `secretKeyRef` con la clave vacía que deja el pod en
      # CreateContainerConfigError. Todo eso lo muestra un render y nada más.
      - name: Render en los modos soportados
        run: |
          set -e
          render() { helm template t helm/teleflow --set apiKey=x "$@"; }

          echo "--- propio (default) ---"
          render > /dev/null

          echo "--- externo: puerto, credenciales y TLS propios ---"
          salida=$(render --set postgres.enabled=false \
            --set externalDatabase.host=pg.ext --set externalDatabase.port=6432 \
            --set externalDatabase.username=tf --set externalDatabase.password=pw \
            --set externalDatabase.database=db --set externalDatabase.sslMode=verify-full)
          echo "$salida" | grep -q 'postgresql+asyncpg://tf:pw@pg.ext:6432/db?ssl=verify-full' \
            || { echo "la URL externa no toma puerto/credenciales/TLS"; exit 1; }
          echo "$salida" | grep -q 'host, port = "pg.ext", 6432' \
            || { echo "el initContainer no espera al puerto externo"; exit 1; }

          # Lo que hace utilizable el camino externo en serio: que la credencial de una base
          # administrada no quede en el spec del pod.
          echo "--- externo con Secret del organismo ---"
          conSecret=$(render --set postgres.enabled=false --set externalDatabase.host=pg.ext \
            --set externalDatabase.password=NO-DEBE-APARECER \
            --set externalDatabase.existingSecret=pg-creds)
          if echo "$conSecret" | grep -q NO-DEBE-APARECER; then
            echo "la password quedó en el render pese al existingSecret"; exit 1
          fi
          echo "$conSecret" | grep -q 'key: "DATABASE_URL"' \
            || { echo "no se consume la URL del Secret del organismo"; exit 1; }

          # La contraseña de la capa de datos propia tiene que existir SOLO dentro de su Secret.
          # Antes se interpolaba en el env de cada pod y aparecía 28 veces, visible para
          # cualquiera con permiso de `get pod`.
          echo "--- la password de la capa de datos vive solo en su Secret ---"
          conPass=$(render --set postgres.auth.password=P4SS --set rabbitmq.auth.password=R4BB)

          # Las 4 esperadas son las claves del Secret (POSTGRES_PASSWORD, DATABASE_URL,
          # RABBITMQ_PASSWORD, RABBITMQ_URL). Cualquier otra es una fuga.
          apariciones=$(echo "$conPass" | grep -cE 'P4SS|R4BB')
          if [ "$apariciones" -ne 4 ]; then
            echo "la password aparece $apariciones veces; se esperaban 4 (las claves del Secret):"
            echo "$conPass" | grep -nE 'P4SS|R4BB'
            exit 1
          fi

          # Y ninguna puede estar en un `value:`, que es como llega al spec del pod.
          if echo "$conPass" | grep -E 'P4SS|R4BB' | grep -q 'value:'; then
            echo "hay una password interpolada en el env de un pod:"
            echo "$conPass" | grep -nE 'P4SS|R4BB' | grep 'value:'
            exit 1
          fi

          echo "--- externo a medio configurar: tiene que fallar y decir qué falta ---"
          if render --set postgres.enabled=false --set externalDatabase.host=pg.ext \
               --set externalDatabase.existingSecret=pg-creds --set externalDatabase.urlKey= \
               2>&1 | grep -q 'urlKey'; then
            echo "ok: falla nombrando la clave que falta"
          else
            echo "un existingSecret sin urlKey debería cortar el install"; exit 1
          fi
