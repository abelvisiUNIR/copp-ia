name: CI

on:
  push:
    branches: [desarrollo, devyos]
  pull_request:
    branches: [desarrollo]

# Cancela corridas viejas del mismo ref si llega una nueva
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests + mypy (strict, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # target del proyecto (pyproject requires-python >=3.11)
          cache: pip

      - name: Install (con extras dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check (mypy --strict)
        # Todo el repo, no solo `teleflow`: los tests también se chequean (sin exigirles
        # anotaciones, ver [tool.mypy.overrides] en pyproject.toml). Correr solo `teleflow`
        # dejaba fuera 58-35 archivos y ocultaba errores reales en los tests.
        run: mypy .

      - name: Tests unitarios
        run: pytest -m "not e2e" -q

      # Las reglas de alerta no las cubre pytest: `promtool test rules` las evalúa contra series
      # sintéticas y comprueba que **disparen** en el escenario correcto. Sin esto, una regla con
      # un nombre de métrica mal escrito pasa CI y no dispara nunca — que es indistinguible de
      # un sistema sano.
      #
      # La versión sale del Dockerfile para no tener dos que se separen: promtool y el
      # Prometheus que va a evaluar estas reglas tienen que ser el mismo.
      - name: Alertas de Prometheus (promtool test rules)
        run: |
          IMAGEN=$(sed -n 's/^FROM //p' observability/prometheus.Dockerfile)
          docker run --rm -v "$PWD:/repo" -w /repo/observability \
            --entrypoint promtool "$IMAGEN" test rules alerts_test.yml

  e2e:
    name: Tests e2e (stack docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Levantar el stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Esperar readiness del gateway
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 3
          done
          echo "gateway no respondió a tiempo" && docker compose logs && exit 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (con extras dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests e2e
        run: pytest -m e2e -q

      # La review-ui se prueba contra el mismo stack: nginx ya sirve el bundle en :3100.
      # Es el componente desde el que se despliega código, así que su camino crítico
      # (aprobar despliega ese borrador, rechazar no despliega) merece cubrirse.
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: review-ui/package-lock.json

      - name: Instalar review-ui + Chromium
        working-directory: review-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests de UI
        working-directory: review-ui
        run: npm test

      - name: Reporte de UI si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: review-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Logs del stack si algo falla
        if: failure()
        run: docker compose logs

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build imagen de servicios Python
        run: docker build -t teleflow:ci .
