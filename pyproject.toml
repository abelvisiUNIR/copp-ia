[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleflow"
version = "1.0.0"
description = "TeleFlow Platform - Business & Software as Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "lark>=1.1.9",
    "networkx>=3.2",
    "httpx>=0.27",
    "aio-pika>=9.4",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[project.scripts]
tflow = "teleflow.cli:main"

[tool.setuptools.packages.find]
include = ["teleflow*"]

[tool.setuptools.package-data]
"teleflow.dsl" = ["*.lark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

# networkx no publica tipos compatibles con py3.11 (sus stubs arrastran numpy
# con sintaxis 3.12). Se trata como sin-tipos; el uso local es acotado.
[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true
