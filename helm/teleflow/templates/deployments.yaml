{{- range $name, $svc := .Values.services }}
{{- $fullName := printf "%s-%s" $.Release.Name $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ $fullName }}
    {{- include "teleflow.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $fullName }}
  template:
    metadata:
      labels:
        app: {{ $fullName }}
        {{- include "teleflow.labels" $ | nindent 8 }}
    spec:
      initContainers:
        {{- include "teleflow.waitForSchema" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["uvicorn", "{{ $svc.module }}", "--host", "0.0.0.0", "--port", "{{ $svc.port }}"]
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- include "teleflow.env" $ | nindent 12 }}
            - name: SERVICE_NAME
              value: {{ $name }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ $fullName }}
    {{- include "teleflow.labels" $ | nindent 4 }}
spec:
  {{- if $svc.external }}
  type: {{ $.Values.gateway.service.type }}
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    app: {{ $fullName }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
